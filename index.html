<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文法を学ぶ</title>
  <style>
    :root { color-scheme: light; --ink:#18243b; --muted:#5c687a; --line:#d9e0ea; --blue:#2459a9; --blue-dark:#18417f; --soft:#eef3fa; --ok:#176b45; --ok-bg:#e9f7ef; --ng:#9b2c2c; --ng-bg:#fff0f0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#f1f4f8; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.75; }
    main { width:min(720px, calc(100% - 32px)); margin:32px auto; }
    header, article { background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 10px 30px rgb(24 36 59 / .07); }
    header { padding:24px 48px 20px; margin-bottom:16px; }
    article { padding:clamp(24px, 5vw, 48px); }
    h1 { margin:0 0 14px; font-size:clamp(1.55rem, 5vw, 2rem); line-height:1.35; text-wrap:balance; }
    h2 { margin:0 0 20px; font-size:clamp(1.35rem, 4vw, 1.7rem); line-height:1.45; text-wrap:balance; }
    p { margin:0 0 1em; }
    .eyebrow { margin:0 0 4px; color:var(--blue); font-weight:700; font-size:.88rem; }
    .current-path { margin:0 0 2px; font-weight:800; }
    .save-status { margin:0 0 14px; color:var(--muted); font-size:.88rem; }
    .save-status-ng { color:var(--ng); font-weight:700; }
    .course-selector { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 14px; }
    .course-selector-label { color:var(--muted); font-size:.88rem; font-weight:700; }
    .course-tab { min-height:44px; padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--blue); font-size:.88rem; }
    .course-tab.current { border-color:var(--blue); background:var(--blue); color:#fff; cursor:default; }
    .progress-details > summary { display:none; color:var(--blue); font-weight:700; cursor:pointer; }
    .steps, .steps ol { margin:0; padding:0; list-style:none; }
    .steps ol { margin:6px 0 6px 12px; padding-left:16px; border-left:2px solid var(--line); }
    .branch { margin-top:6px; }
    .branch > summary { display:flex; align-items:center; gap:8px; min-height:44px; padding:6px 8px; border-radius:8px; list-style:none; cursor:pointer; }
    .branch > summary::-webkit-details-marker { display:none; }
    .branch > summary::before { content:"▸"; color:var(--blue); font-weight:700; }
    .branch[open] > summary::before { content:"▾"; }
    .branch > summary:hover { background:var(--soft); }
    .branch-label { color:var(--ink); font-weight:800; }
    .branch-status { color:var(--muted); font-size:.88rem; font-weight:700; }
    .branch[open] > summary .branch-status { color:var(--blue-dark); }
    .step { display:block; width:100%; min-height:44px; margin:5px 0; padding:10px; border:none; border-radius:8px; background:#edf0f4; color:var(--muted); font-family:inherit; font-size:.88rem; font-weight:700; text-align:left; cursor:pointer; }
    .step:hover:not(.current) { background:#e2e7ee; }
    .step.current { background:var(--blue); color:#fff; cursor:default; }
    .step.done { background:#dce9fa; color:var(--blue-dark); }
    .formula, blockquote { margin:20px 0; padding:16px 18px; border-left:4px solid var(--blue); background:var(--soft); border-radius:0 10px 10px 0; }
    .formula { font-family:ui-monospace,"Cascadia Mono",monospace; font-weight:700; overflow-wrap:anywhere; }
    blockquote p:last-child { margin-bottom:0; }
    .note { color:var(--muted); font-size:.95rem; }
    details.section { margin:20px 0; border:1px solid var(--line); border-radius:10px; padding:0 18px; }
    details.section[open] { padding-bottom:18px; }
    details.section > summary { display:flex; align-items:center; gap:8px; min-height:44px; margin:0 -18px; padding:10px 18px; border-radius:10px; font-size:1.1rem; font-weight:800; cursor:pointer; list-style:none; }
    details.section > summary::-webkit-details-marker { display:none; }
    details.section > summary::before { content:"▸"; color:var(--blue); }
    details.section[open] > summary::before { content:"▾"; }
    details.section > summary:hover { background:var(--soft); }
    details.section > summary + * { margin-top:0; }
    .actions { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-top:30px; }
    .actions > .primary { margin-left:auto; }
    .actions-decision { display:flex; flex-wrap:wrap; gap:12px; margin-left:auto; justify-content:flex-end; }
    button { min-height:48px; padding:10px 20px; border:2px solid transparent; border-radius:10px; font:inherit; font-weight:700; cursor:pointer; }
    button:focus-visible, summary:focus-visible { outline:3px solid #e0a400; outline-offset:3px; }
    .primary { background:var(--blue); color:#fff; }
    .primary:hover { background:var(--blue-dark); }
    .secondary { background:#fff; color:var(--blue); border-color:var(--blue); }
    .choices { display:grid; gap:10px; margin:22px 0; }
    .choice { width:100%; text-align:left; background:#fff; color:var(--ink); border-color:var(--line); }
    .choice:hover:not(:disabled) { border-color:var(--blue); background:var(--soft); }
    .choice:disabled { cursor:default; opacity:1; }
    .choice.correct { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
    .choice.wrong { border-color:var(--ng); background:var(--ng-bg); color:var(--ng); }
    .feedback { padding:16px 18px; border-radius:10px; }
    .feedback.ok { background:var(--ok-bg); color:#104c33; }
    .feedback.ng { background:var(--ng-bg); color:#732020; }
    .feedback strong { display:block; margin-bottom:4px; }
    .question-count { color:var(--muted); font-weight:700; }
    .score { font-size:2.25rem; font-weight:800; color:var(--blue); }
    .review-summary { margin:20px 0; padding:16px 18px; background:var(--soft); border-radius:10px; }
    .review-summary h3 { margin:0 0 10px; font-size:1rem; }
    .review-list { margin:0; padding-left:22px; }
    .review-list li + li { margin-top:10px; }
    .review-list span { display:block; }
    .course-summary .total-score { margin:0 0 10px; font-size:1.5rem; font-weight:800; color:var(--blue); }
    .review-banner { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin:0 0 14px; padding:10px 14px; background:var(--soft); border:1px solid var(--line); border-radius:10px; }
    .review-banner span { font-size:.92rem; font-weight:700; color:var(--blue-dark); }
    @media (max-width:520px) {
      main { margin:16px auto; }
      header, article { padding:24px 20px; }
      .progress-details > summary { display:list-item; min-height:44px; padding:8px 0; }
      .actions { flex-direction:column-reverse; }
      .actions button { width:100%; }
      .actions-decision { flex-direction:column; width:100%; margin-left:0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">英文法ミニレッスン</p>
      <h1 id="course-title">仮定法</h1>
      <div id="course-selector" class="course-selector" role="group" aria-label="文法カテゴリ"></div>
      <p id="current-path" class="current-path"></p>
      <p id="save-status" class="save-status">端末に自動保存済み</p>
      <div id="review-banner" class="review-banner" hidden>
        <span data-review-count></span>
        <button type="button" class="secondary" data-action="start-review">復習を始める</button>
      </div>
      <details class="progress-details">
        <summary>学習の構成を見る</summary>
        <ol id="steps" class="steps" aria-label="学習の構成と進捗"></ol>
      </details>
    </header>
    <article id="content" tabindex="-1"></article>
  </main>
  <script src="content.js"></script>
  <script src="vendor/harness/cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
