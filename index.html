<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文法ミニレッスン</title>
  <link rel="stylesheet" href="styles.css?v=0.3.0">
</head>
<body>
  <a class="skipLink" href="#main">学習内容へ移動</a>
  <div class="wrap">
    <header class="top">
      <h1>英文法ミニレッスン</h1>
      <p id="current-path" class="crumb"></p>
      <p id="save-status" class="save-status" role="status" aria-live="polite">端末に自動保存済み</p>
    </header>
    <main id="main">
      <div id="homePanel" aria-busy="true">
        <div id="course-selector"></div>
        <article id="home-content" tabindex="-1">
          <div class="skeleton" aria-hidden="true">
            <div class="skeletonLine" style="width:35%"></div>
            <div class="skeletonLine skeletonLine--title"></div>
            <div class="skeletonLine" style="width:85%"></div>
            <div class="skeletonLine skeletonLine--cta"></div>
          </div>
          <p class="visuallyHidden">学習データを読み込んでいます。</p>
        </article>
      </div>
      <div id="sessionPanel" class="hide">
        <article id="session-content" tabindex="-1"></article>
      </div>
    </main>
  </div>

  <script src="content.js"></script>
  <script src="vendor/harness/cloud.js"></script>
  <script src="app.js?v=0.3.0"></script>
</body>
</html>
